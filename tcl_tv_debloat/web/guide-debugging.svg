<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
<title id="title">Connect a Google TV: illustrated menu guide</title><desc id="desc">Enable developer options by selecting Android TV OS build seven times, turn on USB debugging, then authorize the computer on the TV. Illustrations are examples; menus vary.</desc>
<rect width="920" height="260" fill="#f5f6f8"/>
<g font-family="Arial, sans-serif" fill="#1f2328">
<g transform="translate(18 18)"><rect width="280" height="224" rx="10" fill="#fff" stroke="#e1e4e8"/><circle cx="25" cy="26" r="13" fill="#ebf1fd"/><text x="21" y="31" font-size="14" fill="#0b57d0">1</text><text x="47" y="31" font-size="16" font-weight="bold">Enable developer options</text><text x="18" y="65" font-size="13" fill="#5b6370">Settings → System → About</text><rect x="18" y="81" width="244" height="54" rx="6" fill="#ebf1fd" stroke="#0b57d0"/><text x="31" y="104" font-size="14" font-weight="bold">Android TV OS build</text><text x="31" y="122" font-size="12" fill="#0b57d0">Select with OK seven times</text><text x="18" y="165" font-size="13">Wait for the developer message.</text><text x="18" y="191" font-size="12" fill="#5b6370">Older TV: Device Preferences → About</text></g>
<g transform="translate(320 18)"><rect width="280" height="224" rx="10" fill="#fff" stroke="#e1e4e8"/><circle cx="25" cy="26" r="13" fill="#ebf1fd"/><text x="21" y="31" font-size="14" fill="#0b57d0">2</text><text x="47" y="31" font-size="16" font-weight="bold">Enable debugging</text><text x="18" y="65" font-size="13" fill="#5b6370">System → Developer options</text><rect x="18" y="81" width="244" height="54" rx="6" fill="#f8f9fb" stroke="#e1e4e8"/><text x="31" y="112" font-size="14">USB / ADB debugging</text><rect x="209" y="98" width="39" height="21" rx="11" fill="#0b57d0"/><circle cx="237" cy="108.5" r="8" fill="#fff"/><text x="18" y="165" font-size="13">Use the IP and connection port</text><text x="18" y="184" font-size="13">provided by your TV.</text><text x="18" y="207" font-size="12" fill="#5b6370">Network debugging must be supported.</text></g>
<g transform="translate(622 18)"><rect width="280" height="224" rx="10" fill="#fff" stroke="#e1e4e8"/><circle cx="25" cy="26" r="13" fill="#ebf1fd"/><text x="21" y="31" font-size="14" fill="#0b57d0">3</text><text x="47" y="31" font-size="16" font-weight="bold">Authorize your computer</text><rect x="18" y="58" width="244" height="92" rx="6" fill="#f8f9fb" stroke="#e1e4e8"/><text x="31" y="82" font-size="14" font-weight="bold">Allow USB debugging?</text><text x="31" y="103" font-size="12" fill="#5b6370">Check this is your own computer.</text><rect x="168" y="115" width="79" height="25" rx="5" fill="#0b57d0"/><text x="192" y="132" font-size="12" fill="#fff">Allow</text><text x="18" y="176" font-size="13">Accept the prompt on the TV.</text><text x="18" y="197" font-size="13">Then refresh in this app if needed.</text></g>
</g></svg>
